<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy anniversary!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- SCM Music Player https://scmplayer.net -->
<script type="text/javascript" src="https://scmplayer.net/script.scm.js" 
data-config="{'skin':'skins/aquaPink/skin.css','volume':54,'shuffle':true,'repeat':1,'placement':'bottom','showplaylist':false,'playlist':[{'title':'Suicide - Surrender','url':'https://youtu.be/d3YLklu5AzI?si=Dd4eLYLHN_L3rtmN'},{'title':'Those Years Are Over - The Sha La Das','url':'https://youtu.be/aIwdOsyIAMw?si=qPgrjMVgn2LZpobO'},{'title':'Lovers Rock - TV Girl','url':'https://youtu.be/acfYQmCBsz8?si=ZLtwo42EMTe_oshA'},{'title':'My Kind of Woman - Mac DeMarco','url':'https://youtu.be/Dc_u4DHExj4?si=HYtjp9v7iDLcolnj'},{'title':'Mrs Magic - Strawberry Guy','url':'https://youtu.be/smsm1yvstrw?si=VtpWQoKoDvUnwza2'}]}" ></script>
<!-- SCM Music Player script end -->
    
<main class="collage">

    <!-- BACKGROUND -->
    <img src="images/background.png" class="background" alt="">

    <!-- POLAROIDS -->

    <button class="polaroid polaroid-2" data-image="images/photo2.png" data-back="images/back2.png">
        <img src="images/photo2.png" alt="Photo 2">
    </button>

    <button class="polaroid polaroid-3" data-image="images/photo3.png" data-back="images/back3.png">
        <img src="images/photo3.png" alt="Photo 3">
    </button>

    <button class="polaroid polaroid-4" data-image="images/photo4.png" data-back="images/back4.png">
        <img src="images/photo4.png" alt="Photo 4">
    </button>

</main>


<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">

    <button class="close" id="close">×</button>

    <!-- SCALE WRAPPER -->
    <div class="flip-card-scale">

        <!-- FLIPPABLE CARD -->
        <div class="flip-card" id="flipCard">

            <!-- FRONT -->
            <div class="flip-card-front">
                <img id="largePhoto" src="" alt="">
            </div>

            <!-- BACK -->
            <div class="flip-card-back">
                <img id="backPhoto" src="" alt="">
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
